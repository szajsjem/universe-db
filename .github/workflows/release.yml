name: release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (tag contents, not current main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
      - name: Install lint dependency
        run: python -m pip install ruff==0.12.12
      - name: Validate release assets
        run: |
          make check
          sha256sum --check universe.db.sha256
          if [[ -f universe-unverified.db ]]; then
            sha256sum --check universe-unverified.db.sha256
          elif [[ -f universe-unverified.db.sha256 ]]; then
            echo "Companion checksum exists but its database is missing" >&2
            exit 1
          else
            echo "This tag predates the unverified companion database."
          fi
      - name: Build combined release bundle when supported by tag
        run: |
          if [[ -f scripts/export_release.py ]]; then
            python scripts/export_release.py --version "$RELEASE_TAG"
            (
              cd "dist/releases/$RELEASE_TAG"
              sha256sum --check ./*.db.sha256
            )
            (
              cd dist/releases
              sha256sum --check "universe-$RELEASE_TAG.zip.sha256"
            )
          fi
      - name: Publish release assets
        run: |
          if [[ -f scripts/export_release.py ]]; then
            bundle="dist/releases/$RELEASE_TAG"
            assets=(
              "$bundle/universe.db" "$bundle/universe.db.sha256"
              "$bundle/universe-reviewed.db" "$bundle/universe-reviewed.db.sha256"
              "$bundle/universe-unverified.db" "$bundle/universe-unverified.db.sha256"
              "$bundle/alloys.db" "$bundle/alloys.db.sha256"
              "$bundle/manifest.json"
              "dist/releases/universe-$RELEASE_TAG.zip"
              "dist/releases/universe-$RELEASE_TAG.zip.sha256"
            )
            if [[ -f "$bundle/elements.db" ]]; then
              assets+=("$bundle/elements.db" "$bundle/elements.db.sha256")
            fi
            if [[ -f "$bundle/isotopes.db" ]]; then
              assets+=("$bundle/isotopes.db" "$bundle/isotopes.db.sha256")
            fi
          else
            assets=(universe.db universe.db.sha256 manifest.json)
            if [[ -f universe-unverified.db ]]; then
              assets+=(universe-unverified.db universe-unverified.db.sha256)
            fi
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
