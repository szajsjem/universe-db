name: database

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate release assets and reproducibility
        run: make check
      - name: Verify validation did not modify release assets
        run: |
          git diff --exit-code -- \
            universe.db universe.db.sha256 \
            universe-unverified.db universe-unverified.db.sha256 \
            manifest.json
      - name: Verify checksums
        run: |
          sha256sum --check universe.db.sha256
          sha256sum --check universe-unverified.db.sha256
