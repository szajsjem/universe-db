name: database

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Rebuild and validate
        run: make check
      - name: Verify checked-in artifact is current
        run: git diff --exit-code -- universe.db universe.db.sha256 manifest.json
      - name: Verify checksum
        run: sha256sum --check universe.db.sha256
